# fly.toml app configuration file generated for voyager2-reminder on 2025-07-08T18:54:56+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'voyager2-reminder'
primary_region = 'bom'
swap_size_mb = 512

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[mounts]
  source="db"
  destination="/data"

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
